name: FitMatch
options:
  bundleIdPrefix: com.fitmatch
  deploymentTarget:
    iOS: "17.0"
settings:
  SWIFT_VERSION: "5.0"
targets:
  FitMatch:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: FitMatch
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.lucaberardi06.frontend
      INFOPLIST_FILE: FitMatch/Info.plist
      GENERATE_INFOPLIST_FILE: false
      TARGETED_DEVICE_FAMILY: "1"
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
      DEVELOPMENT_TEAM: 6F8J3B65D7
      CODE_SIGN_STYLE: Automatic

  FitMatchAdmin:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: FitMatchAdmin
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.lucaberardi06.admin
      INFOPLIST_FILE: FitMatchAdmin/Info.plist
      GENERATE_INFOPLIST_FILE: false
      TARGETED_DEVICE_FAMILY: "1"
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
      DEVELOPMENT_TEAM: 6F8J3B65D7
      CODE_SIGN_STYLE: Automatic
